# หน้า demo แบบ static (ผลที่คำนวณไว้แล้ว) บน GitHub Pages
# กดรันเอง (Actions → pages → Run workflow) หลังเปิด Settings → Pages → Source: GitHub Actions
name: pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: demo/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
